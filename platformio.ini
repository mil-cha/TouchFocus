; TouchFocus handcontroller - Guition JC4880P443C_I_W / ESP32-P4 rev v1.3 ES

[platformio]
boards_dir = boards
default_envs = jc4880p4

[env:jc4880p4]
; Keep this exact pioarduino release: adjacent releases may boot-loop this ES chip.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36-1/platform-espressif32.zip
board = jc4880p4
framework = arduino

monitor_speed = 115200
upload_speed = 460800

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv

lib_deps =
    lvgl@~8.3.0

build_flags =
    -DCORE_DEBUG_LEVEL=4
    -DBOARD_HAS_PSRAM
    -DBOARD_JC4880P4
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_PATH="${PROJECT_DIR}/lv_conf.h"
    -DCONFIG_ESP_LCD_TOUCH_MAX_POINTS=5
    -DESP_LCD_ST7701_VER_MAJOR=2
    -DESP_LCD_ST7701_VER_MINOR=0
    -DESP_LCD_ST7701_VER_PATCH=2
    -DBOARD_P4_LCD_RST=5
    -DBOARD_P4_LCD_BL=23
    -DBOARD_P4_TOUCH_SDA=7
    -DBOARD_P4_TOUCH_SCL=8
    -DBOARD_P4_TOUCH_RST=3
    -DBOARD_P4_TOUCH_INT=-1
    -DBOARD_P4_DSI_LDO_CHAN=3
    -DBOARD_P4_DSI_LDO_MV=2500

[env:jc4880p4_ota]
extends = env:jc4880p4
upload_protocol = espota
upload_port = TouchFocus.local
